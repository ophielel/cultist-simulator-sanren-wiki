services:
  database:
    image: mariadb:11.8
    restart: unless-stopped
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: mediawiki
      MARIADB_USER: wikiuser
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [wiki]

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [wiki]

  mediawiki:
    image: mediawiki:1.43
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    environment:
      TZ: Asia/Shanghai
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      WIKI_ADMIN_PASSWORD: ${WIKI_ADMIN_PASSWORD}
    volumes:
      - ./wiki/images:/var/www/html/images
      - ./wiki/cache:/var/www/html/cache
      - ./wiki/sessions:/var/www/html/sessions
      - ./config/LocalSettings.php:/var/www/html/LocalSettings.php:ro
      - ./config/GeneratedSettings.php:/var/www/html/GeneratedSettings.php
      - ./config/InstallerSettings.php:/var/www/html/InstallerSettings.php:ro
      - ./config/SanrenHooks.php:/var/www/html/SanrenHooks.php:ro
      - ./assets:/var/www/html/sanren:ro
      - ./wiki/extensions:/var/www/html/local-extensions
    networks: [wiki]

  installer:
    image: mediawiki:1.43
    profiles: ["setup"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      WIKI_ADMIN_PASSWORD: ${WIKI_ADMIN_PASSWORD}
    volumes:
      - ./config:/config
    networks: [wiki]

volumes:
  db-data:

networks:
  wiki:
    internal: false
